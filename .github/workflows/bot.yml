name: UFC Line Bot

on:
  schedule:
    # Start attempts every 2h at :07 (off the top-of-hour rush).
    # Each run watches for 5 hours, so dropped starts overlap harmlessly.
    - cron: "7 */2 * * *"
  workflow_dispatch:

concurrency:
  group: ufc-line-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Watch for new lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LOOP_MINUTES: "300"
        run: python bot.py
